            // Animated number counter
            function animateCount(el, target, prefix, suffix, duration) {
                if (!el) return;
                const start = performance.now();
                const from = 0;
                function tick(now) {
                    const t = Math.min((now - start) / duration, 1);
                    const ease = 1 - Math.pow(1 - t, 3);
                    el.textContent =
                        prefix +
                        Math.round(
                            from + (target - from) * ease,
                        ).toLocaleString() +
                        suffix;
                    if (t < 1) requestAnimationFrame(tick);
                }
                requestAnimationFrame(tick);
            }

            // Debounce helper
            function debounce(fn, ms) {
                let t;
                return function (...a) {
                    clearTimeout(t);
                    t = setTimeout(() => fn.apply(this, a), ms);
                };
            }

            // â”€â”€ UTILS â”€â”€
            function gz(s) {
                const z = ST[s];
                return z == null ? null : Array.isArray(z) ? z : [z];
            }
            function jz(a, b) {
                const az = gz(a),
                    bz = gz(b);
                if (!az || !bz) return null;
                let bm = 99,
                    bx = 99,
                    bs = 99;
                for (const f of az)
                    for (const t of bz) {
                        const lo = Math.min(f, t),
                            hi = Math.max(f, t),
                            sp = hi - lo;
                        if (sp < bs || (sp === bs && lo > 1 && bm === 1)) {
                            bm = lo;
                            bx = hi;
                            bs = sp;
                        }
                    }
                const k = bm === bx ? "" + bm : `${bm}-${bx}`;
                const zs = [];
                for (let z = bm; z <= bx; z++) zs.push(z);
                return { k, min: bm, max: bx, zs };
            }
            function tck(k) {
                if (!k.includes("-")) {
                    const z = +k;
                    return `${z}-${z + 1}`;
                }
                return k;
            }
            function isPk(t) {
                if (!t) return true;
                const [h, m] = t.split(":").map(Number);
                const x = h * 60 + m;
                return (x >= 390 && x <= 570) || (x >= 960 && x <= 1140);
            }
            function takeHome(g) {
                if (!g || g <= 0) return 0;
                let t = 0,
                    n = 0;
                if (g > 12570) t += Math.min(g - 12570, 37700) * 0.2;
                if (g > 50270) t += Math.min(g - 50270, 74730) * 0.4;
                if (g > 125000) t += (g - 125000) * 0.45;
                if (g > 12570) n += Math.min(g - 12570, 37700) * 0.08;
                if (g > 50270) n += (g - 50270) * 0.02;
                return g - t - n;
            }

            // â”€â”€ SEARCH â”€â”€
            const snames = Object.keys(ST).sort();
            function search(q) {
                const ql = q.toLowerCase().trim();
                if (ql.length < 1) return [];
                // Check aliases first
                const alias = ALIASES[ql];
                if (alias && ST[alias] != null) return [alias];
                // Partial alias matches
                const aliasMatches = [];
                for (const [ak, av] of Object.entries(ALIASES)) {
                    if (ak.includes(ql) && !aliasMatches.includes(av))
                        aliasMatches.push(av);
                }
                const pf = [],
                    ct = [];
                for (const n of snames) {
                    const nl = n.toLowerCase();
                    if (nl.startsWith(ql)) pf.push(n);
                    else if (nl.includes(ql)) ct.push(n);
                }
                const combined = [
                    ...aliasMatches.filter(
                        (a) => !pf.includes(a) && !ct.includes(a),
                    ),
                    ...pf,
                    ...ct,
                ];
                return [...new Set(combined)].slice(0, 12);
            }

                dd.classList.add("open");

            function setupAC(iid, did) {
                const inp = document.getElementById(iid),

                const debouncedSearch = debounce(() => {
                    const r = search(inp.value);

                    renderDD(dd, r, inp);
                    if (ST[inp.value] != null) {
                        inp.classList.add("ok");

                    }
                }, 80);
                inp.addEventListener("input", () => {
                    inp.classList.remove("ok");
                    updateGoBtn();
                    debouncedSearch();
                });
                inp.addEventListener("keydown", (e) => {
                    const its = dd.querySelectorAll(".aci");
                    if (e.key === "ArrowDown") {
                        e.preventDefault();
                        ai = Math.min(ai + 1, its.length - 1);
                    } else if (e.key === "ArrowUp") {
                        e.preventDefault();
                        ai = Math.max(ai - 1, 0);
                    } else if (e.key === "Enter" && ai >= 0) {
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        inp.value = its[ai].dataset.n;
                        inp.classList.add("ok");
                        dd.classList.remove("open");
                        inp.removeAttribute("aria-activedescendant");
                        updateGoBtn();
                        recalc();
                        return;
                    } else if (e.key === "Escape") {
                        dd.classList.remove("open");
                        inp.setAttribute("aria-expanded", "false");
                        inp.removeAttribute("aria-activedescendant");
                        return;
                    }
                    its.forEach((x, i) => {
                        x.classList.toggle("act", i === ai);
                        x.setAttribute(
                            "aria-selected",
                            i === ai ? "true" : "false",
                        );
                    });
                    if (ai >= 0) {
                        its[ai].scrollIntoView({ block: "nearest" });
                        inp.setAttribute("aria-activedescendant", its[ai].id);
                    }
                });
                inp.addEventListener("blur", () =>
                    setTimeout(() => dd.classList.remove("open"), 150),
                );
                inp.addEventListener("focus", () => {
                    if (inp.value.length >= 1)
                        renderDD(dd, search(inp.value), inp);

            // â”€â”€ COMPUTE â”€â”€
            function comp(name, zk, days, trips, mp, ep, bus, leave, hrow) {
                const ww = 52 - leave;
                const bpd = days > 0 ? bus / days : 0;
                const fare = F.single[zk];
                if (!fare) return null;
                const tk = tck(zk);
                let daily, weekly, annual, monthly, perTrip;

                if (name === "payg") {
                    let rd;
                    if (trips === 1) rd = mp ? fare.p : fare.o;
                    else if (trips === 2)
                        rd = (mp ? fare.p : fare.o) + (ep ? fare.p : fare.o);
                    else {
                        const pk = Math.ceil(trips / 2),
                            op = trips - pk;
                        rd = (mp ? pk * fare.p : pk * fare.o) + op * fare.o;
                    }
                    if (hrow) rd = trips * fare.p;
                    const cr = Math.min(rd, F.dcap[zk]);
                    const db = Math.min(bpd * F.bus.s, F.bus.dc);
                    // Weekend days are always off-peak on TfL (Heathrow excepted)
                    const wkd = Math.min(days, 5),
                        wke = Math.max(0, days - 5);
                    let wkRaw;
                    if (wke > 0 && !hrow) {
                        const rdWke = trips * fare.o;
                        const crWke = Math.min(rdWke, F.dcap[zk]);
                        wkRaw = (cr + db) * wkd + (crWke + db) * wke;
                    } else {
                        wkRaw = (cr + db) * days;
                    }
                    weekly = Math.min(wkRaw, F.wcap[zk]);
                    daily = weekly / days;
                    annual = weekly * ww;
                    monthly = annual / 12;
                    perTrip = annual / (days * trips * ww);
                } else if (name === "payg_rc") {
                    const d = F.rc.d;
                    let rd;
                    if (trips === 1) rd = mp ? fare.p : fare.o * (1 - d);
                    else if (trips === 2)
                        rd =
                            (mp ? fare.p : fare.o * (1 - d)) +
                            (ep ? fare.p : fare.o * (1 - d));
                    else {
                        const pk = Math.ceil(trips / 2),
                            op = trips - pk;
                        rd =
                            (mp ? pk * fare.p : pk * fare.o * (1 - d)) +
                            op * fare.o * (1 - d);
                    }
                    const bp = mp && ep;
                    const cap = bp ? F.dcap[zk] : F.rc.dcap[zk] || F.dcap[zk];
                    const cr = Math.min(rd, cap);
                    const db = Math.min(bpd * F.bus.s, F.bus.dc);
                    // Weekend: all off-peak, railcard discount applies to all trips
                    const wkd = Math.min(days, 5),
                        wke = Math.max(0, days - 5);
                    let wkRaw;
                    if (wke > 0 && !hrow) {
                        const rdWke = trips * fare.o * (1 - d);
                        const capWke = F.rc.dcap[zk] || F.dcap[zk];
                        const crWke = Math.min(rdWke, capWke);
                        wkRaw = (cr + db) * wkd + (crWke + db) * wke;
                    } else {
                        wkRaw = (cr + db) * days;
                    }
                    weekly = wkRaw;
                    daily = weekly / days;
                    annual = weekly * ww + F.rc.cost;
                    monthly = annual / 12;
                    perTrip = annual / (days * trips * ww);
                } else if (name === "tc_w") {
                    const pr = F.tc.w[tk];
                    if (!pr) return null;
                    weekly = pr;
                    daily = weekly / days;
                    annual = weekly * ww;
                    monthly = annual / 12;
                    perTrip = annual / (days * trips * ww);
                } else if (name === "tc_m") {
                    const pr = F.tc.m[tk];
                    if (!pr) return null;
                    monthly = pr;
                    const wm = ww / (52 / 12);
                    annual = monthly * wm;
                    weekly = monthly / (52 / 12);
                    daily = weekly / days;
                    perTrip = annual / (days * trips * ww);
                } else if (name === "tc_a") {
                    const pr = F.tc.a[tk];
                    if (!pr) return null;
                    annual = pr;
                    monthly = annual / 12;
                    weekly = annual / 52;
                    daily = weekly / days;
                    perTrip = annual / (days * trips * ww);
                } else if (name === "tc_a_rc") {
                    const pr = F.tc.a[tk];
                    if (!pr) return null;
                    annual = Math.round(pr * (1 - F.rc.d)) + F.rc.cost;
                    monthly = annual / 12;
                    weekly = annual / 52;
                    daily = weekly / days;
                    perTrip = annual / (days * trips * ww);
                }
                return {
                    name,
                    daily: +daily.toFixed(2),
                    weekly: +weekly.toFixed(2),
                    monthly: +monthly.toFixed(2),
                    annual: +annual.toFixed(2),
                    perTrip: +perTrip.toFixed(2),
                };
            }

            // â”€â”€ GO BUTTON â”€â”€
            function handleGo() {
                const btn = document.getElementById("goBtn");
                if (btn.classList.contains("disabled")) return;
                document.querySelectorAll(".acd.open").forEach((menu) => menu.classList.remove("open"));
                const res = document.getElementById("res");
                btn.textContent = "Calculating";
                btn.classList.add("loading");

                    btn.classList.remove("loading");
                    recalc();
                    document.querySelectorAll(".acd.open").forEach((menu) => menu.classList.remove("open"));
                    res.setAttribute("aria-busy", "false");
                    btn.textContent = "compare fares";
                    if (res.classList.contains("vis")) {
                        res.scrollIntoView({
                            behavior: "smooth",
                            block: "start",
                        });
                        const reco = document.getElementById("reco");
                        if (reco) reco.focus({ preventScroll: true });
                    } else
                        btn.textContent = "Pick two different stations above";
                }, 150);

            function updateGoBtn() {
                const f = document.getElementById("fromStation").value,
                    t = document.getElementById("toStation").value;
                const btn = document.getElementById("goBtn"),
                    hint = document.getElementById("goHint");
                const fOk = ST[f] != null,
                    tOk = ST[t] != null;
                if (fOk && tOk) {
                    btn.classList.remove("disabled");
                    btn.classList.add("ready");
                    hint.classList.add("hidden");
                } else {
                    btn.classList.add("disabled");
                    btn.classList.remove("ready");
                    hint.classList.remove("hidden");
                    hint.textContent =
                        !fOk && !tOk
                            ? "Pick your departure and arrival stations above to get started"
                            : !fOk
                              ? "Now pick your departure station"
                              : "Now pick your arrival station";
                }
            }

            // â”€â”€ MAIN â”€â”€
            function recalc() {
                try {
                    const from = document.getElementById("fromStation").value,
                        to = document.getElementById("toStation").value;
                    const j = jz(from, to);
                    const jbar = document.getElementById("jbar"),
                        jerr = document.getElementById("jerr");

                    // Same station check
                    if (from && to && from === to && ST[from] != null) {
                        jbar.classList.remove("vis");
                        jerr.textContent =
                            "You've picked the same station for both. Choose a different destination to see your commute costs.";
                        jerr.classList.add("vis");
                        document.getElementById("res").classList.remove("vis");
                        return;
                    }

                    if (!j) {
                        jbar.classList.remove("vis");
                        jerr.classList.remove("vis");
                        document.getElementById("res").classList.remove("vis");
                        return;
                    }

                    // Zone 7+ warning
                    if (j.max > 6) {
                        jerr.classList.add("vis");
                        jerr.textContent =
                            "Zone " +
                            j.max +
                            " fares are estimates. TfL charges National Rail rates for zones 7-9 which can vary. Verify at tfl.gov.uk.";
                    } else {
                        jerr.classList.remove("vis");
                    }

                    // Zone viz
                    document.getElementById("zvis").innerHTML = j.zs
                        .map(
                            (z, i) =>
                                `${i ? '<div class="zcon"></div>' : ""}<div class="zd ${ZC[z] || "z9"}" style="animation-delay:${i * 0.05}s" aria-label="Zone ${z}">${z}</div>`,
                        )
                        .join("");
                    const hrow = [from, to].some((s) =>
                        s.toLowerCase().includes("heathrow"),
                    );
                    const sf = F.single[j.k];
                    if (sf)
                        document.getElementById("fprev").textContent =
                            `Single: Â£${sf.p.toFixed(2)} peak / Â£${hrow ? sf.p.toFixed(2) : sf.o.toFixed(2)} off-peak`;
                    jbar.classList.add("vis");

                    // Inputs
                    const dt = document.getElementById("dept").value,
                        rt = document.getElementById("ret").value;
                    const mp = isPk(dt),
                        ep = isPk(rt);
                    const si = (id, pk) => {

                const cm = document.getElementById("curMethod").value;
                const banner = document.getElementById("switchBanner");
                if (cm === "unknown") {
                    banner.style.display = "none";
                    return;
                }
                let curCost;
                if (cm === "driving") {
                    const zs = j.max - j.min;
                    const em = 5 + zs * 4;
                    const isZ1 = j.min === 1;
                    const df = em * 2 * (1.45 / (35 / 4.546));
                    const dd = df + (isZ1 ? 15 : 0) + 12;
                    curCost = dd * days * (52 - leave);
                } else {
                    const r = comp(
                        cm,
                        j.k,
                        days,
                        trips,
                        mp,
                        ep,
                        bus,
                        leave,
                        hrow,
                    );
                    curCost = r ? r.annual : null;
                }
                if (!curCost || curCost <= cheap.annual) {
                    banner.style.display = "none";
                    return;
                }
                const sv = Math.round(curCost - cheap.annual);
                const fromLabel =
                    cm === "driving" ? "Driving" : LABELS[cm] || cm;
                banner.style.display = "";
                banner.innerHTML = `<div class="switch-banner"><div class="sw-from">Right now you're paying: ${fromLabel} (Â£${Math.round(curCost)}/yr)</div><div class="sw-arrow">&#8595;</div><div class="sw-to">If you switched to: ${LABELS[cheap.name]} (Â£${cheap.annual.toFixed(0)}/yr)</div><div class="sw-save count-anim">You'd save Â£${sv} a year</div></div>`;
            }

            // â”€â”€ BREAK-EVEN ANALYSIS â”€â”€
            function renderBreakEven(
                j,
                days,
                trips,
                mp,
                ep,
                bus,
                leave,
                hrow,
                hasRc,
            ) {
                const sec = document.getElementById("beSection");
                const tk = tck(j.k);
                // We need weekly travelcard to exist
                if (!F.tc.w[tk]) {
                    sec.style.display = "none";
                    return;
                }
                sec.style.display = "";

                const ww = 52 - leave;
                const pts = [];
                let crossDay = null;
                for (let d = 1; d <= 7; d++) {
                    const payg = comp(
                        "payg",
                        j.k,
                        d,
                        trips,
                        mp,
                        ep,
                        Math.round((bus * d) / days),
                        leave,
                        hrow,
                    );
                    const tcw = comp(
                        "tc_w",
                        j.k,
                        d,
                        trips,
                        mp,
                        ep,
                        Math.round((bus * d) / days),
                        leave,
                        hrow,
                    );
                    if (payg && tcw) {
                        pts.push({ d, payg: payg.annual, tc: tcw.annual });
                        if (!crossDay && tcw.annual <= payg.annual)
                            crossDay = d;
                    }
                }
                if (pts.length < 2) {
                    sec.style.display = "none";
                    return;
                }

                const maxY =
                    Math.max(...pts.map((p) => Math.max(p.payg, p.tc))) * 1.08;
                const w = 100,
                    h = 100;
                const px = (d) => ((d - 1) / 6) * w;
                const py = (v) => h - (v / maxY) * h;

                const paygLine = pts
                    .map(
                        (p, i) =>
                            `${i ? "L" : "M"}${px(p.d).toFixed(1)},${py(p.payg).toFixed(1)}`,
                    )
                    .join(" ");
                const tcLine = pts
                    .map(
                        (p, i) =>
                            `${i ? "L" : "M"}${px(p.d).toFixed(1)},${py(p.tc).toFixed(1)}`,
                    )
                    .join(" ");

                let crossMark = "";
                if (crossDay) {
                    const cp = pts.find((p) => p.d === crossDay);
                    if (cp)
                        crossMark = `<circle cx="${px(cp.d).toFixed(1)}" cy="${py(cp.tc).toFixed(1)}" r="3" fill="var(--red)" stroke="var(--card)" stroke-width="1.5"/>`;
                }

                document.getElementById("beChart").innerHTML = `
        <div class="be-svg-wrap">
        <svg viewBox="-5 -5 ${w + 10} ${h + 15}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            ${pts.map((p) => `<line x1="${px(p.d)}" y1="${h}" x2="${px(p.d)}" y2="${h + 3}" stroke="var(--border)" stroke-width="0.5"/><text x="${px(p.d)}" y="${h + 10}" text-anchor="middle" font-size="4" fill="var(--dim)">${p.d}d</text>`).join("")}
            <path d="${paygLine}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="${tcLine}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            ${pts.map((p) => `<circle cx="${px(p.d).toFixed(1)}" cy="${py(p.payg).toFixed(1)}" r="2" fill="var(--blue)" stroke="var(--card)" stroke-width="1"><title>${p.d}d PAYG: Â£${Math.round(p.payg)}/yr</title></circle><circle cx="${px(p.d).toFixed(1)}" cy="${py(p.tc).toFixed(1)}" r="2" fill="var(--green)" stroke="var(--card)" stroke-width="1"><title>${p.d}d Pass: Â£${Math.round(p.tc)}/yr</title></circle>`).join("")}
            ${crossMark}
        </svg></div>
        <div class="be-legend"><span><span class="dot dot-payg"></span>Pay as you go</span><span><span class="dot dot-pass"></span>Weekly pass</span></div>`;

                document.getElementById("beCrossover").innerHTML = crossDay
                    ? `<div class="be-crossover">A weekly pass starts saving you money at <strong>${crossDay} days per week</strong>. If you commute less than that, just tap in and out.</div>`
                    : `<div class="be-crossover">Pay as you go is cheaper no matter how many days you commute for this journey.</div>`;
            }

            // â”€â”€ CYCLING COMPARISON â”€â”€
            function renderCycling(cheap, j, days, leave) {
                const sec = document.getElementById("cycSection");
                sec.style.display = "";
                const ww = 52 - leave;
                const estMiles = 5 + (j.max - j.min) * 4; // rough distance
                const estKm = Math.round(estMiles * 1.61);
                const santanderAnnual = 20 * 12;
                const ownBikeAnnual = 200;
                const tubeAnn = cheap.annual;
                const opts = [
                    {
                        mode: "Tube/Rail",
                        price: tubeAnn,
                        detail: LABELS[cheap.name],
                        best: false,
                    },
                    {
                        mode: "Santander Bikes",
                        price: santanderAnnual,
                        detail: "Â£20/mo, rides under 30 min free",
                        best: false,
                    },
                    {
                        mode: "Own bicycle",
                        price: ownBikeAnnual,
                        detail: "~Â£200/yr maintenance & insurance",
                        best: false,
                    },
                ];
                const minP = Math.min(...opts.map((o) => o.price));
                opts.forEach((o) => (o.best = o.price === minP));
                const annualRides = days * 2 * ww;
                const calPerRide = Math.round(estKm * 25); // ~25 cal per km cycling
                const annualCal = Math.round((annualRides * calPerRide) / 1000);
                let cycNote = "";
                if (estKm > 20)
                    cycNote = `<div class="cyc-warn">At ~${estKm}km each way, this is a very long cycle â€” realistic only for committed cyclists with e-bikes.</div>`;
                else if (estKm > 12)
                    cycNote = `<div class="cyc-warn">At ~${estKm}km each way, this is a solid ride (~${Math.round(estKm * 3)}min). Doable but plan for weather and hills.</div>`;
                document.getElementById("cycGrid").innerHTML =
                    opts
                        .map(
                            (o) =>
                                `<div class="cyc-card ${o.best ? "best-cyc" : ""}"><div class="cyc-mode">${o.mode}</div><div class="cyc-price">Â£${Math.round(o.price)}/yr</div><div class="cyc-detail">${o.detail}</div></div>`,
                        )
                        .join("") +
                    cycNote +
                    `<div class="cyc-footer">Estimated one-way distance: ~${estKm}km. Cycling ${days} days/week burns ~${annualCal},000 calories/year.</div>`;
            }

            // â”€â”€ SHARE RESULTS â”€â”€
            function shareResults() {
                const from = document.getElementById("fromStation").value,
                    to = document.getElementById("toStation").value;
                const days = document.getElementById("days").value;
                const rows = document.querySelectorAll("#tbody tr");
                let text = `My London commute costs (${from} â†’ ${to}, ${days} days/week)\n\n`;
                let first = true;
                rows.forEach((r) => {
                    const cells = r.querySelectorAll("td");
                    if (cells.length >= 6) {
                        text += `${first ? "â†’ " : " "} ${cells[0].textContent}: ${cells[5].textContent}/yr (${cells[3].textContent}/wk)${first ? " âœ“ CHEAPEST" : ""}\n`;
                        first = false;
                    }
                });
                text += `\nCalculated with London Commute Cost Optimizer`;
                // Try native share on mobile, fallback to clipboard
                if (
                    navigator.share &&
                    /Mobi|Android/i.test(navigator.userAgent)
                ) {
                    navigator
                        .share({ title: "My London Commute Costs", text: text })
                        .catch(() => {});
                    return;
                }
                const onCopied = () => {
                    const btn = document.getElementById("shareBtn");
                    btn.textContent = "Copied!";
                    btn.classList.add("copied");
                    btn.setAttribute(
                        "aria-label",
                        "Results copied to clipboard",
                    );
                    setTimeout(() => {
                        btn.textContent = "Copy results to clipboard";
                        btn.classList.remove("copied");
                        btn.setAttribute(
                            "aria-label",
                            "Copy results to clipboard",
                        );
                    }, 2000);
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard
                        .writeText(text)
                        .then(onCopied)
                        .catch(() => {
                            // Fallback for permission denied
                            const ta = document.createElement("textarea");
                            ta.value = text;
                            ta.style.cssText = "position:fixed;left:-9999px";
                            document.body.appendChild(ta);
                            ta.select();
                            try {
                                document.execCommand("copy");
                                onCopied();
                            } catch (e) {}
                            document.body.removeChild(ta);
                        });
                } else {
                    const ta = document.createElement("textarea");
                    ta.value = text;
                    ta.style.cssText = "position:fixed;left:-9999px";
                    document.body.appendChild(ta);
                    ta.select();
                    try {
                        document.execCommand("copy");
                        onCopied();
                    } catch (e) {}
                    document.body.removeChild(ta);
                }
            }

            // â”€â”€ LOCAL STORAGE â”€â”€
            const SAVE_FIELDS = [
                "fromStation",
                "toStation",
                "days",
                "trips",
                "dept",
                "ret",
                "bus",
                "leave",
                "rc",
                "sal",
                "curMethod",
            ];
            function saveInputs() {
                const data = {};
                SAVE_FIELDS.forEach((id) => {
                    const el = document.getElementById(id);
                    if (el) data[id] = el.value;
                });
                try {
                    localStorage.setItem("lco_inputs", JSON.stringify(data));
                } catch (e) {}
            }
            function loadInputs() {
                try {
                    const raw = localStorage.getItem("lco_inputs");
                    if (!raw) return;
                    const data = JSON.parse(raw);
                    SAVE_FIELDS.forEach((id) => {
                        const el = document.getElementById(id);
                        if (el && data[id] != null) {
                            el.value = data[id];
                            if (id === "fromStation" || id === "toStation") {
                                if (ST[data[id]] != null)
                                    el.classList.add("ok");
                            }
                        }
                    });
                    recalc();
                } catch (e) {}
            }

            // â”€â”€ SCROLL REVEAL â”€â”€
            function setupReveal() {
                const obs = new IntersectionObserver(
                    (entries) => {
                        entries.forEach((e) => {
                            if (e.isIntersecting) {
                                e.target.classList.add("visible");
                                obs.unobserve(e.target);
                            }
                        });
                    },
                    { threshold: 0.1 },
                );
                document
                    .querySelectorAll(".reveal")
                    .forEach((el) => obs.observe(el));
            }

            // Station inputs auto-update journey bar (zones preview) immediately; dropdown is debounced via setupAC
            document
                .getElementById("fromStation")
                .addEventListener("input", function () {
                    this.classList.toggle("ok", ST[this.value] != null);
                    updateGoBtn();
                    updateJourneyBar();
                    if (ST[this.value] == null)
                        document.getElementById("res").classList.remove("vis");
                });
            document
                .getElementById("toStation")
                .addEventListener("input", function () {
                    this.classList.toggle("ok", ST[this.value] != null);
                    updateGoBtn();
                    updateJourneyBar();
                    if (ST[this.value] == null)
                        document.getElementById("res").classList.remove("vis");
                });

            // Progress step aria helper
            function updateProgressAria() {
                ["ps1", "ps2", "ps3"].forEach((id) => {
                    const el = document.getElementById(id);
                    if (el.classList.contains("active"))
                        el.setAttribute("aria-current", "step");
                    else el.removeAttribute("aria-current");
                });
            }

            // Step 2 progress â€” activate when user interacts with commute details
            [
                "days",
                "trips",
                "dept",
                "ret",
                "bus",
                "leave",
                "rc",
                "sal",
                "curMethod",
            ].forEach((id) => {
                document
                    .getElementById(id)
                    .addEventListener("change", function () {
                        const ps2 = document.getElementById("ps2");
                        if (!ps2.classList.contains("done")) {
                            ps2.classList.add("active");
                            document
                                .getElementById("pl1")
                                .classList.add("done");
                            updateProgressAria();
                        }
                    });
            });

            // Time inputs update the peak/off-peak badges live
            document.getElementById("dept").addEventListener("input", () => {
                const m = isPk(document.getElementById("dept").value);
                const el = document.getElementById("mInd");
                el.textContent = m ? "PEAK" : "OFF-PEAK";
                el.className = "tb " + (m ? "pk" : "op");
            });
            document.getElementById("ret").addEventListener("input", () => {
                const e = isPk(document.getElementById("ret").value);
                const el = document.getElementById("eInd");
                el.textContent = e ? "PEAK" : "OFF-PEAK";
                el.className = "tb " + (e ? "pk" : "op");
            });

            function updateJourneyBar() {
                const from = document.getElementById("fromStation").value,
                    to = document.getElementById("toStation").value;
                const j = jz(from, to);
                const jbar = document.getElementById("jbar"),
                    jerr = document.getElementById("jerr");
                if (from && to && from === to && ST[from] != null) {
                    jbar.classList.remove("vis");
                    jerr.textContent =
                        "You've picked the same station for both. Choose a different destination to see your commute costs.";
                    jerr.classList.add("vis");
                    return;
                }
                if (!j) {
                    jbar.classList.remove("vis");
                    jerr.classList.remove("vis");
                    return;
                }
                if (j.max > 6) {
                    jerr.classList.add("vis");
                    jerr.textContent =
                        "Zone " +
                        j.max +
                        " fares are estimates. TfL charges National Rail rates for zones 7-9 which can vary. Verify at tfl.gov.uk.";
                } else {
                    jerr.classList.remove("vis");
                }
                document.getElementById("zvis").innerHTML = j.zs
                    .map(
                        (z, i) =>
                            `${i ? '<div class="zcon"></div>' : ""}<div class="zd ${ZC[z] || "z9"}" style="animation-delay:${i * 0.05}s" aria-label="Zone ${z}">${z}</div>`,
                    )
                    .join("");
                const hrow = [from, to].some((s) =>
                    s.toLowerCase().includes("heathrow"),
                );
                const sf = F.single[j.k];
                if (sf)
                    document.getElementById("fprev").textContent =
                        `Single: Â£${sf.p.toFixed(2)} peak / Â£${hrow ? sf.p.toFixed(2) : sf.o.toFixed(2)} off-peak`;
                jbar.classList.add("vis");
                // Update progress: step 1 done, step 2 active
                document.getElementById("ps1").classList.add("done");
                document.getElementById("ps1").classList.remove("active");
                document.getElementById("pl1").classList.add("done");
                document.getElementById("ps2").classList.add("active");
                updateProgressAria();
            }

            // Back to top button visibility + dismiss autocomplete on scroll
            window.addEventListener(
                "scroll",
                () => {
                    const btt = document.getElementById("btt");
                    btt.classList.toggle("show", window.scrollY > 600);
                    document.querySelectorAll(".acd.open").forEach((d) => {
                        d.classList.remove("open");
                    });
                },
                { passive: true },
            );

            // Table scroll hint â€” hide once user scrolls the table
            document.getElementById("tableWrap").addEventListener(
                "scroll",
                function () {
                    if (this.scrollLeft > 10) this.classList.add("scrolled");
                },
                { passive: true },
            );

            // Go button click
            document
                .getElementById("goBtn")
                .addEventListener("click", handleGo);
            // Enter key triggers Go from any input
            document.querySelectorAll(".si").forEach((el) => {
                el.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" && !el.classList.contains("acd")) {
                        e.preventDefault();
                        handleGo();
                    }
                });
            });
            // Ctrl+Enter global shortcut
            document.addEventListener("keydown", (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                    e.preventDefault();
                    handleGo();
                }
            });

            // Action buttons
            const scrollToHero = () =>
                document
                    .querySelector(".hero")
                    .scrollIntoView({ behavior: "smooth" });
            document
                .getElementById("btt")
                .addEventListener("click", scrollToHero);
            document
                .getElementById("recalcBtn")
                .addEventListener("click", scrollToHero);
            document
                .getElementById("ctaPrint")
                .addEventListener("click", () => window.print());
            document
                .getElementById("printBtn")
                .addEventListener("click", () => window.print());
            document
                .getElementById("shareBtn")
                .addEventListener("click", shareResults);
            document
                .getElementById("resetBtn")
                .addEventListener("click", () => {
                    if (confirm("Clear all your inputs and start fresh?")) {
                        localStorage.removeItem("lco_inputs");
                        location.reload();
                    }
                });

            // FAQ â€” render once, delegate events (never re-rendered by recalc)
            (() => {
                const faqs = [
                    [
                        "Does tapping my bank card automatically get me the cheapest price?",
                        "Pretty much! Contactless has a built-in weekly spending limit that matches what a weekly pass costs. So if you travel a lot, you never pay more than the pass price. If you travel less, you pay less. It's the best of both worlds.",
                    ],
                    [
                        "Should I get an Oyster card or just use my bank card?",
                        "Your bank card (or phone) is better for most people because it has weekly spending caps that Oyster doesn't. The only time Oyster wins is if you have a Railcard â€” that discount only works with Oyster.",
                    ],
                    [
                        "What happens if I forget to tap out?",
                        "You'll get charged up to Â£9.40 as an \"incomplete journey\" penalty. It's annoying but you can claim a refund on the TfL website within 8 weeks.",
                    ],
                    [
                        "Can I use my phone instead of a card?",
                        "Absolutely. Apple Pay, Google Pay, and Samsung Pay all work exactly the same. You still get all the same spending caps.",
                    ],
                    [
                        "Do children need to pay?",
                        "Under 11s ride free. 11-15 year olds get free bus/tram travel with a Zip card. 16-17 year olds can get half price with a 16+ Zip Oyster.",
                    ],
                    [
                        "What about the Elizabeth Line?",
                        "It's included in the normal fare system â€” same zones, same caps, same card. Nothing extra to think about.",
                    ],
                    [
                        "Is it cheaper to travel at weekends?",
                        "Yes! All day Saturday, Sunday, and bank holidays count as off-peak, so fares are lower. Great for weekend plans.",
                    ],
                    [
                        "How accurate is this calculator?",
                        "This is an estimate using the bundled March 2026 fare tables. It compares common ticket rules â€” including daily caps, weekly caps, boundary station optimisation, and Railcard discounts. The only thing we can't predict is unexpected closures or using different routes on different days.",
                    ],
                ];
                const faqEl = document.getElementById("faq");
                faqEl.innerHTML = faqs
                    .map(
                        ([q, a], i) =>
                            `<div class="faq-item${i === 0 ? " open" : ""}"><div class="faq-q" tabindex="0" role="button" aria-expanded="${i === 0 ? "true" : "false"}">${q}</div><div class="faq-a">${a}</div></div>`,
                    )
                    .join("");
                faqEl.addEventListener("click", (e) => {
                    const q = e.target.closest(".faq-q");
                    if (!q) return;
                    q.parentElement.classList.toggle("open");
                    q.setAttribute(
                        "aria-expanded",
                        q.parentElement.classList.contains("open"),
                    );
                });
                faqEl.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        const q = e.target.closest(".faq-q");
                        if (!q) return;
                        e.preventDefault();
                        q.click();
                    }
                });
            })();

            // Init
            loadInputs();
            if (!document.getElementById("fromStation").value) {
                document.getElementById("fromStation").value = "Stratford";
                document.getElementById("toStation").value = "Euston Square";
                document.getElementById("days").value = "3";
                recalc();
            }
            // Show initial peak badges
            (() => {
                const m = isPk(document.getElementById("dept").value);
                const e = isPk(document.getElementById("ret").value);
                const mi = document.getElementById("mInd"),
                    ei = document.getElementById("eInd");
                mi.textContent = m ? "PEAK" : "OFF-PEAK";
                mi.className = "tb " + (m ? "pk" : "op");
                ei.textContent = e ? "PEAK" : "OFF-PEAK";
                ei.className = "tb " + (e ? "pk" : "op");
            })();
            updateGoBtn();
            updateJourneyBar();
            // If results already loaded from localStorage, hide teaser
            if (document.getElementById("res").classList.contains("vis"))
                document.getElementById("teaser").style.display = "none";
        </script>
